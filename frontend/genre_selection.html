<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch - Escolha seu Gênero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>CineMatch - Escolha seu Gênero Favorito</h1>
    </header>

    <main>
        <form id="genreForm">
            <select id="genreSelect" required>
                <option value="">-- Escolha um gênero --</option>
                <option value="Animation">Animação</option>
                <option value="Drama">Drama</option>
                <option value="Musical">Musical</option>
                <option value="Comedy">Comédia</option>
                <option value="Action">Ação</option>
                <option value="Adventure">Aventura</option>
                <option value="Crime">Crime</option>
                <option value="Biography">Biografia</option>
                <option value="Documentary">Documentário</option>
                <option value="Western">Faroeste</option>
                <option value="Horror">Terror</option>
                <option value="Mystery">Mistério</option>
                <option value="Fantasy">Fantasia</option>
                <option value="Sci-Fi">Ficção Científica</option>
                <option value="Family">Família</option>
            </select>

            <button type="submit">Ver Recomendações</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 CineMatch. Todos os direitos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
